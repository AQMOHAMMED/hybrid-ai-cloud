{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:440px;margin:40px auto">
  <h2>{{ t.login }}</h2>
  {% if err %}<div class="alert err">{{ err }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ t.username }}</label><input name="email" type="text" value="{{ email }}" required autocomplete="username" autocapitalize="none" dir="ltr">
    <label>{{ t.password }}</label><input name="password" type="password" required autocomplete="current-password">
    <div style="height:16px"></div>
    <button class="btn gold full" type="submit">{{ t.login }}</button>
  </form>
</div>
{% endblock %}
